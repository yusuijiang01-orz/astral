<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#11242c" />
    <title>星隙行者 · Astral Rift</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <canvas id="world" aria-label="星隙行者三维游戏世界"></canvas>
    <div id="vignette"></div>
    <section id="hud" hidden>
      <button id="portrait" aria-label="角色与装备">
        ✦<small id="level">Lv.1</small>
      </button>
      <div id="vitals">
        <div class="bar hp"><i></i><span></span></div>
        <div class="bar mp"><i></i><span></span></div>
        <div class="bar stamina"><i></i><span></span></div>
        <div id="buffs"></div>
      </div>
      <div id="location">
        <small>ASTRAL RIFT</small><strong id="room-name"></strong
        ><span id="objective"></span>
      </div>
      <button id="pause" aria-label="暂停菜单">☰</button>
      <div id="bossbar" hidden>
        <strong></strong>
        <div><i></i></div>
      </div>
      <div id="joystick" aria-label="移动摇杆">
        <span id="knob"></span><small>移动</small>
      </div>
      <div id="combat">
        <button class="skill s0" data-action="s0" aria-label="烬羽突进">
          <b>➤</b><small>烬羽</small><em></em></button
        ><button class="skill s1" data-action="s1" aria-label="霜镜结界">
          <b>❄</b><small>霜镜</small><em></em></button
        ><button class="skill s2" data-action="s2" aria-label="回岚轮">
          <b>✥</b><small>回岚</small><em></em></button
        ><button class="skill s3" data-action="s3" aria-label="雷隙步">
          <b>ϟ</b><small>雷隙</small><em></em></button
        ><button id="attack" data-action="attack" aria-label="普通攻击">
          <b>⚔</b><small>攻击</small></button
        ><button id="dodge" data-action="dodge" aria-label="闪避">
          ↠<small>闪避</small></button
        ><button class="skill ultimate" data-action="s4" aria-label="星冠坠落">
          <b>✦</b><small>星冠</small><em></em>
        </button>
      </div>
      <button id="interact" data-action="interact" hidden>交互 · E</button>
      <div id="pickup-label"></div>
      <div id="keyboard-hint">
        WASD 移动 · J 攻击 · K 闪避 · 1–4 技能 · R 星冠 · E 交互 · 右侧拖动视角
      </div>
    </section>
    <div id="numbers"></div>
    <div id="toast" role="status"></div>
    <div id="overlay"></div>
    <div id="debug" hidden></div>
    <div id="rotate">
      <span>↻</span>
      <h2>请横屏开始旅程</h2>
      <p>将手机旋转至横向，关闭系统竖屏锁定。</p>
      <button id="fullscreen">尝试全屏横屏</button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
